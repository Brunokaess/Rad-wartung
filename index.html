<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fahrrad-Wartung</title>
<meta name="theme-color" content="#1f6b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rad-Wartung">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --ink: #1d2320; --muted: #6b726e; --line: #e3e0d9;
    --brand: #1f6b52; --brand-soft: #e3efe9;
    --red: #c4442f; --red-soft: #fbe9e5; --amber: #b7791f; --amber-soft: #fbf1df;
    --green: #2f8a5f; --blue: #3d6fb6; --blue-soft: #e6eef9;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121614; --card: #1c211f; --ink: #eef1ef; --muted: #9aa39e; --line: #2c3330;
      --brand: #4fb48a; --brand-soft: #1d3129;
      --red: #ef7a65; --red-soft: #3a1f1a; --amber: #e3ab52; --amber-soft: #352a16;
      --green: #5cc08e; --blue: #7fa7e6; --blue-soft: #1c2738;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(12px + env(safe-area-inset-top)) 18px 10px;
  }
  header h1 { margin: 0; font-size: 30px; letter-spacing: -0.5px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  main { padding: 4px 16px 24px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 22px 4px 8px; font-weight: 600; }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; border: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .title { font-weight: 600; font-size: 17px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 99px; }
  .pill.over { background: var(--red-soft); color: var(--red); }
  .pill.soon { background: var(--amber-soft); color: var(--amber); }
  .pill.ok { background: var(--brand-soft); color: var(--green); }
  .pill.new { background: var(--blue-soft); color: var(--blue); }
  .bar { width: 5px; align-self: stretch; border-radius: 3px; }
  .bar.over { background: var(--red); } .bar.soon { background: var(--amber); }
  .bar.ok { background: var(--green); } .bar.new { background: var(--blue); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 11px; padding: 10px 14px; font-weight: 600; }
  .btn { background: var(--brand); color: #fff; }
  .btn.small { padding: 8px 12px; font-size: 14px; }
  .btn.ghost { background: var(--brand-soft); color: var(--brand); }
  .btn.danger { background: var(--red-soft); color: var(--red); }
  .btn.block { width: 100%; padding: 14px; font-size: 17px; margin-top: 8px; }
  .link { background: none; color: var(--brand); padding: 4px 0; font-weight: 600; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .big { font-size: 46px; }
  .banner { background: var(--amber-soft); color: var(--ink); border-radius: var(--radius); padding: 12px 14px; margin: 8px 0 4px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
  .list-item { padding: 12px 0; border-top: 1px solid var(--line); }
  .list-item:first-child { border-top: 0; }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; background: color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button { flex: 1; background: none; color: var(--muted); padding: 8px 0 7px; font-size: 11px; font-weight: 600; border-radius: 0; position: relative; }
  nav.tabs button svg { display: block; margin: 0 auto 2px; width: 26px; height: 26px; }
  nav.tabs button.active { color: var(--brand); }
  .badge { position: absolute; top: 4px; left: 50%; margin-left: 6px; background: var(--red); color: #fff; font-size: 11px; min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; padding: 0 5px; }

  /* Kalender */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 10px; }
  .cal-head strong { font-size: 18px; }
  .cal-head button { background: var(--card); border: 1px solid var(--line); color: var(--ink); width: 40px; height: 40px; padding: 0; font-size: 20px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .wd { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; padding-bottom: 4px; }
  .day { aspect-ratio: 1 / 1.05; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 0 0; text-align: center; font-size: 15px; color: var(--ink); font-weight: 500; display: flex; flex-direction: column; align-items: center; }
  .day.other { opacity: .35; }
  .day.today .num { background: var(--brand); color: #fff; border-radius: 99px; width: 26px; height: 26px; line-height: 26px; }
  .day.sel { outline: 2px solid var(--brand); outline-offset: -1px; }
  .day .num { width: 26px; height: 26px; line-height: 26px; }
  .dots { display: flex; gap: 3px; margin-top: 3px; flex-wrap: wrap; justify-content: center; max-width: 30px; }
  .dot { width: 6px; height: 6px; border-radius: 3px; }
  .dot.done { background: var(--green); } .dot.due { background: var(--amber); } .dot.over { background: var(--red); }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin: 10px 2px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  /* Sheet */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: none; }
  .backdrop.open { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg);
    border-radius: 18px 18px 0 0; max-height: 92vh; overflow-y: auto;
    padding: 8px 18px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .25s ease; max-width: 640px; margin: 0 auto;
  }
  .sheet.open { transform: translateY(0); }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sheet-head h3 { margin: 0; font-size: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 14px 2px 6px; }
  input, select, textarea {
    width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 11px; padding: 12px; -webkit-appearance: none; appearance: none;
  }
  textarea { min-height: 70px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 2px 0; }
  .chk { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 16px; color: var(--ink); margin: 0; font-weight: 400; }
  .chk input { width: 22px; height: 22px; -webkit-appearance: checkbox; appearance: auto; flex: none; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
  ol.steps { padding-left: 20px; margin: 6px 0; font-size: 15px; } ol.steps li { margin: 4px 0; }
</style>
</head>
<body>
<header>
  <h1 id="h-title">Fällig</h1>
  <p id="h-sub"></p>
</header>
<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="due" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>
    Fällig<span class="badge" id="badge" hidden></span>
  </button>
  <button data-tab="cal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    Kalender
  </button>
  <button data-tab="bikes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="16" r="3.5"/><circle cx="18.5" cy="16" r="3.5"/><path d="M5.5 16 9 9h7l2.5 7M9 9l3.5 7L16 9M8 6.5h3M15 6.5h2"/></svg>
    Räder
  </button>
  <button data-tab="more">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 10a4 4 0 0 1-.5 8z"/><path d="M12 11v6M9.5 13.5 12 11l2.5 2.5"/></svg>
    Sicherung
  </button>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheet-body"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file-in" accept=".json,application/json" hidden>

<script>
"use strict";
/* ---------- Daten ---------- */
const KEY = "rad-wartung-daten-v1";
const TEMPLATES = [
  { name: "Reifendruck prüfen", days: 14, km: 0 },
  { name: "Kette reinigen & ölen", days: 30, km: 300 },
  { name: "Bremsen prüfen (Beläge, Funktion)", days: 90, km: 1000 },
  { name: "Kette auf Verschleiß messen", days: 180, km: 1500 },
  { name: "Schaltung einstellen", days: 180, km: 0 },
  { name: "Licht & Reflektoren prüfen", days: 90, km: 0 },
  { name: "Schrauben nachziehen", days: 180, km: 0 },
  { name: "Große Inspektion", days: 365, km: 3000 }
];
const BIKE_TYPES = ["Trekkingrad", "Rennrad", "Mountainbike", "E-Bike", "Stadtrad", "Gravelbike", "Anderes"];

let state = load();
let tab = "due";
let calMonth = startOfMonth(new Date());
let calSel = todayISO();

function blank() { return { version: 1, bikes: [], log: [], meta: { lastChange: null, lastBackup: null } }; }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blank();
    const d = JSON.parse(raw);
    return valid(d) ? d : blank();
  } catch (e) { return blank(); }
}
function valid(d) { return d && Array.isArray(d.bikes) && Array.isArray(d.log); }
function save(changed = true) {
  if (changed) state.meta.lastChange = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast("Speichern fehlgeschlagen"); }
}

/* ---------- Hilfen ---------- */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function pad(n) { return String(n).padStart(2, "0"); }
function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function todayISO() { return iso(new Date()); }
function parse(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
function diffDays(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
const fmt = (s) => s ? parse(s).toLocaleDateString("de-DE", { day: "numeric", month: "short", year: "numeric" }) : "–";
const fmtShort = (s) => parse(s).toLocaleDateString("de-DE", { day: "numeric", month: "short" });
const km = (n) => Number(n || 0).toLocaleString("de-DE") + " km";
const bikeById = (id) => state.bikes.find((b) => b.id === id);
function intervalText(t) {
  const p = [];
  if (t.days) p.push(t.days % 30 === 0 && t.days >= 30 ? (t.days / 30 === 1 ? "monatlich" : "alle " + t.days / 30 + " Monate") : t.days === 7 ? "wöchentlich" : "alle " + t.days + " Tage");
  if (t.km) p.push("alle " + km(t.km));
  return p.join(" oder ") || "ohne Intervall";
}

/* Status einer Wartungsaufgabe */
function status(bike, t) {
  if (!t.lastDate) return { level: "new", text: "Noch nie eingetragen" };
  const out = { level: "ok", nextDate: null, daysLeft: null, kmLeft: null };
  if (t.days) { out.nextDate = addDays(t.lastDate, t.days); out.daysLeft = diffDays(todayISO(), out.nextDate); }
  if (t.km && bike.km != null && t.lastKm != null) out.kmLeft = (t.lastKm + t.km) - bike.km;
  const over = (out.daysLeft != null && out.daysLeft < 0) || (out.kmLeft != null && out.kmLeft <= 0);
  const soon = (out.daysLeft != null && out.daysLeft <= 7) || (out.kmLeft != null && out.kmLeft <= 100);
  out.level = over ? "over" : soon ? "soon" : "ok";
  const parts = [];
  if (out.daysLeft != null) {
    const d = out.daysLeft;
    parts.push(d < 0 ? "seit " + (-d) + (d === -1 ? " Tag" : " Tagen") + " fällig" : d === 0 ? "heute fällig" : d === 1 ? "morgen fällig" : "in " + d + " Tagen");
  }
  if (out.kmLeft != null) parts.push(out.kmLeft <= 0 ? km(-out.kmLeft) + " drüber" : "noch " + km(out.kmLeft));
  out.text = parts.join(" · ") || "–";
  return out;
}
function allTasks() {
  const r = [];
  state.bikes.forEach((b) => b.tasks.forEach((t) => r.push({ bike: b, task: t, st: status(b, t) })));
  return r;
}

/* ---------- UI-Grundgerüst ---------- */
const view = document.getElementById("view");
document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  tab = b.dataset.tab; render(); window.scrollTo(0, 0);
});
function setHeader(t, s) { document.getElementById("h-title").textContent = t; document.getElementById("h-sub").textContent = s || ""; }
function render() {
  document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  const n = allTasks().filter((x) => x.st.level === "over").length;
  const badge = document.getElementById("badge"); badge.hidden = !n; badge.textContent = n;
  ({ due: renderDue, cal: renderCal, bikes: renderBikes, more: renderMore })[tab]();
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
function openSheet(html) {
  document.getElementById("sheet-body").innerHTML = html;
  document.getElementById("backdrop").classList.add("open");
  document.getElementById("sheet").classList.add("open");
}
function closeSheet() {
  document.getElementById("backdrop").classList.remove("open");
  document.getElementById("sheet").classList.remove("open");
}
document.getElementById("backdrop").addEventListener("click", closeSheet);
function sheetHead(title) { return `<div class="sheet-head"><h3>${esc(title)}</h3><button class="link" data-act="close">Schließen</button></div>`; }

/* Zentrale Klick-Behandlung über data-act */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  const acts = {
    close: closeSheet,
    "new-bike": () => bikeForm(),
    "edit-bike": () => bikeForm(d.bike),
    "open-bike": () => bikeDetail(d.bike),
    done: () => doneForm(d.bike, d.task),
    "free-work": () => doneForm(d.bike, null),
    "km": () => kmForm(d.bike),
    "new-task": () => taskForm(d.bike),
    "edit-task": () => taskForm(d.bike, d.task),
    "del-log": () => delLog(d.log),
    "day": () => { calSel = d.date; renderCal(); },
    "cal-prev": () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderCal(); },
    "cal-next": () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderCal(); },
    "cal-today": () => { calMonth = startOfMonth(new Date()); calSel = todayISO(); renderCal(); },
    "export": exportData,
    "import": () => document.getElementById("file-in").click(),
    "ics": exportICS,
    "wipe": wipe,
    "go-more": () => { tab = "more"; render(); },
    "go-bikes": () => { tab = "bikes"; render(); }
  };
  if (acts[a]) { e.preventDefault(); acts[a](); }
});

/* ---------- Ansicht: Fällig ---------- */
function backupBanner() {
  const m = state.meta;
  if (!state.bikes.length || !m.lastChange) return "";
  if (m.lastBackup && m.lastBackup >= m.lastChange) return "";
  const days = m.lastBackup ? Math.floor((Date.now() - new Date(m.lastBackup)) / 86400000) : null;
  if (days != null && days < 7) return "";
  return `<div class="banner"><span style="font-size:22px">☁️</span><div class="grow">${m.lastBackup ? "Letzte Sicherung vor " + days + " Tagen." : "Noch keine Sicherung in iCloud."} Neue Einträge sind nur auf diesem Gerät.</div><button class="btn small" data-act="export">Sichern</button></div>`;
}
function taskCard(x) {
  const { bike, task, st } = x;
  const label = { over: "Überfällig", soon: "Bald", ok: "OK", new: "Neu" }[st.level];
  return `<div class="card row">
    <div class="bar ${st.level}"></div>
    <div class="grow">
      <div class="title">${esc(task.name)}</div>
      <div class="sub">${esc(bike.name)} · ${esc(st.text)}</div>
      <div class="sub" style="margin-top:4px"><span class="pill ${st.level}">${label}</span> ${task.lastDate ? "zuletzt " + fmt(task.lastDate) : ""}</div>
    </div>
    <button class="btn small" data-act="done" data-bike="${bike.id}" data-task="${task.id}">Erledigt</button>
  </div>`;
}
function renderDue() {
  const items = allTasks();
  const over = items.filter((x) => x.st.level === "over");
  const soon = items.filter((x) => x.st.level === "soon");
  const neu = items.filter((x) => x.st.level === "new");
  const ok = items.filter((x) => x.st.level === "ok");
  setHeader("Fällig", state.bikes.length ? (over.length ? over.length + " überfällig" : "Alles im grünen Bereich") + " · " + state.bikes.length + (state.bikes.length === 1 ? " Rad" : " Räder") : "");
  if (!state.bikes.length) {
    view.innerHTML = `<div class="empty"><div class="big">🚲</div><p><strong>Noch keine Räder angelegt.</strong><br>Lege das erste Rad an. Typische Wartungsarbeiten werden gleich vorgeschlagen.</p>
      <button class="btn" data-act="new-bike">Erstes Rad anlegen</button>
      <p class="hint" style="margin-top:24px">Daten schon auf einem anderen Gerät? <button class="link" data-act="go-more">Aus iCloud laden</button></p></div>`;
    return;
  }
  const sortD = (a, b) => (a.st.daysLeft ?? 9999) - (b.st.daysLeft ?? 9999);
  let h = backupBanner();
  if (over.length) h += `<h2>Überfällig</h2>` + over.sort(sortD).map(taskCard).join("");
  if (soon.length) h += `<h2>Diese Woche</h2>` + soon.sort(sortD).map(taskCard).join("");
  if (neu.length) h += `<h2>Noch kein Datum</h2><p class="hint" style="margin:-4px 4px 8px">Tippe auf „Erledigt", wenn du ungefähr weißt, wann es zuletzt gemacht wurde.</p>` + neu.map(taskCard).join("");
  if (ok.length) h += `<h2>Später</h2>` + ok.sort(sortD).map(taskCard).join("");
  if (!items.length) h += `<div class="empty"><p>Für deine Räder sind noch keine Wartungsarbeiten angelegt.</p><button class="btn" data-act="go-bikes">Zu den Rädern</button></div>`;
  view.innerHTML = h;
}

/* ---------- Ansicht: Kalender ---------- */
function eventsByDay() {
  const map = {};
  const add = (d, e) => (map[d] = map[d] || []).push(e);
  state.log.forEach((l) => add(l.date, { kind: "done", l }));
  allTasks().forEach((x) => { if (x.st.nextDate) add(x.st.nextDate, { kind: x.st.level === "over" ? "over" : "due", x }); });
  return map;
}
function renderCal() {
  setHeader("Kalender", "Erledigte und anstehende Wartungen");
  const map = eventsByDay();
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y, m, 1);
  const offset = (first.getDay() + 6) % 7; // Montag = 0
  const start = new Date(y, m, 1 - offset);
  const today = todayISO();
  let cells = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].map((w) => `<div class="wd">${w}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const s = iso(d);
    if (i >= 35 && d.getMonth() !== m) break;
    const ev = map[s] || [];
    const dots = ev.slice(0, 6).map((e) => `<span class="dot ${e.kind}"></span>`).join("");
    cells += `<button class="day ${d.getMonth() !== m ? "other" : ""} ${s === today ? "today" : ""} ${s === calSel ? "sel" : ""}" data-act="day" data-date="${s}"><span class="num">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  const sel = map[calSel] || [];
  const list = sel.length ? sel.map((e) => {
    if (e.kind === "done") {
      const b = bikeById(e.l.bikeId);
      return `<div class="list-item row"><span class="dot done"></span><div class="grow"><div class="title" style="font-size:16px">${esc(e.l.taskName)}</div><div class="sub">${esc(b ? b.name : "gelöschtes Rad")}${e.l.km != null ? " · bei " + km(e.l.km) : ""}${e.l.cost ? " · " + Number(e.l.cost).toLocaleString("de-DE", { style: "currency", currency: "EUR" }) : ""}</div>${e.l.note ? `<div class="sub">${esc(e.l.note)}</div>` : ""}</div></div>`;
    }
    const { bike, task } = e.x;
    return `<div class="list-item row"><span class="dot ${e.kind}"></span><div class="grow"><div class="title" style="font-size:16px">${esc(task.name)}</div><div class="sub">${esc(bike.name)} · fällig</div></div><button class="btn small ghost" data-act="done" data-bike="${bike.id}" data-task="${task.id}">Erledigt</button></div>`;
  }).join("") : `<p class="sub" style="margin:4px 0">Nichts an diesem Tag.</p>`;

  view.innerHTML = `
    <div class="cal-head"><button data-act="cal-prev" aria-label="Vorheriger Monat">‹</button>
      <strong>${first.toLocaleDateString("de-DE", { month: "long", year: "numeric" })}</strong>
      <button data-act="cal-next" aria-label="Nächster Monat">›</button></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span><i class="dot done"></i>erledigt</span><span><i class="dot due"></i>geplant</span><span><i class="dot over"></i>überfällig</span>
      <button class="link" style="margin-left:auto" data-act="cal-today">Heute</button></div>
    <h2>${parse(calSel).toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" })}</h2>
    <div class="card">${list}</div>
    <button class="btn ghost block" data-act="ics">📅 Fällige Termine in den iPhone-Kalender</button>
    <p class="hint">Legt die nächsten Wartungstermine mit Erinnerung um 9 Uhr im Kalender an. Der iPhone-Kalender synchronisiert sie über iCloud auf alle Geräte.</p>`;
}

/* ---------- Ansicht: Räder ---------- */
function renderBikes() {
  setHeader("Räder", state.bikes.length ? state.bikes.length + (state.bikes.length === 1 ? " Rad" : " Räder") : "");
  let h = state.bikes.map((b) => {
    const st = b.tasks.map((t) => status(b, t).level);
    const o = st.filter((l) => l === "over").length, s = st.filter((l) => l === "soon").length;
    const last = state.log.filter((l) => l.bikeId === b.id).sort((a, c) => c.date.localeCompare(a.date))[0];
    return `<div class="card row" data-act="open-bike" data-bike="${b.id}" style="cursor:pointer">
      <div style="font-size:30px">🚲</div>
      <div class="grow"><div class="title">${esc(b.name)}</div>
        <div class="sub">${esc(b.type || "")}${b.km != null ? " · " + km(b.km) : ""}</div>
        <div class="sub" style="margin-top:4px">${o ? `<span class="pill over">${o} überfällig</span> ` : ""}${s ? `<span class="pill soon">${s} bald</span> ` : ""}${!o && !s ? `<span class="pill ok">alles ok</span> ` : ""}${last ? "zuletzt " + fmtShort(last.date) : ""}</div></div>
      <span style="color:var(--muted);font-size:22px">›</span></div>`;
  }).join("");
  if (!state.bikes.length) h = `<div class="empty"><div class="big">🚲</div><p>Noch keine Räder.</p></div>`;
  view.innerHTML = h + `<button class="btn block" data-act="new-bike">+ Rad hinzufügen</button>`;
}

function bikeDetail(id) {
  const b = bikeById(id); if (!b) return;
  const tasks = b.tasks.map((t) => {
    const st = status(b, t);
    return `<div class="list-item row"><div class="bar ${st.level}"></div>
      <div class="grow" data-act="edit-task" data-bike="${b.id}" data-task="${t.id}" style="cursor:pointer">
        <div class="title" style="font-size:16px">${esc(t.name)}</div>
        <div class="sub">${esc(intervalText(t))} · ${esc(st.text)}</div></div>
      <button class="btn small ghost" data-act="done" data-bike="${b.id}" data-task="${t.id}">Erledigt</button></div>`;
  }).join("") || `<p class="sub">Noch keine Wartungsarbeiten.</p>`;
  const logs = state.log.filter((l) => l.bikeId === b.id).sort((a, c) => c.date.localeCompare(a.date) || (c.created || "").localeCompare(a.created || ""));
  const total = logs.reduce((s, l) => s + (Number(l.cost) || 0), 0);
  const hist = logs.map((l) => `<div class="list-item row"><div class="grow"><div class="title" style="font-size:16px">${esc(l.taskName)}</div>
      <div class="sub">${fmt(l.date)}${l.km != null ? " · " + km(l.km) : ""}${l.cost ? " · " + Number(l.cost).toLocaleString("de-DE", { style: "currency", currency: "EUR" }) : ""}</div>
      ${l.note ? `<div class="sub">${esc(l.note)}</div>` : ""}</div>
      <button class="link" style="color:var(--muted)" data-act="del-log" data-log="${l.id}" aria-label="Eintrag löschen">✕</button></div>`).join("") || `<p class="sub">Noch nichts eingetragen.</p>`;
  openSheet(sheetHead(b.name) + `
    <div class="sub">${esc(b.type || "")}${b.notes ? " · " + esc(b.notes) : ""}</div>
    <div class="two" style="margin-top:12px">
      <button class="btn ghost" data-act="km" data-bike="${b.id}">Tacho: ${b.km != null ? km(b.km) : "–"}</button>
      <button class="btn ghost" data-act="free-work" data-bike="${b.id}">+ Reparatur</button>
    </div>
    <h2>Wartungsplan</h2><div class="card">${tasks}</div>
    <button class="link" data-act="new-task" data-bike="${b.id}">+ Wartungsarbeit hinzufügen</button>
    <h2>Verlauf${total ? " · " + total.toLocaleString("de-DE", { style: "currency", currency: "EUR" }) + " gesamt" : ""}</h2><div class="card">${hist}</div>
    <button class="btn ghost block" data-act="edit-bike" data-bike="${b.id}">Rad bearbeiten</button>`);
}

/* ---------- Formulare ---------- */
function bikeForm(id) {
  const b = id ? bikeById(id) : null;
  const tpl = !b ? `<label>Wartungsarbeiten übernehmen</label><div class="card" style="padding:4px 14px">${TEMPLATES.map((t, i) =>
    `<label class="chk"><input type="checkbox" name="tpl" value="${i}" checked><span class="grow">${esc(t.name)}<br><span class="sub">${esc(intervalText(t))}</span></span></label>`).join("")}</div>
    <p class="hint">Intervalle kannst du später pro Rad anpassen.</p>` : "";
  openSheet(sheetHead(b ? "Rad bearbeiten" : "Neues Rad") + `
    <form id="f-bike">
      <label>Name</label><input name="name" required placeholder="z. B. Mein Trekkingrad" value="${esc(b?.name)}">
      <div class="two">
        <div><label>Art</label><select name="type">${BIKE_TYPES.map((t) => `<option ${b?.type === t ? "selected" : ""}>${t}</option>`).join("")}</select></div>
        <div><label>Tachostand (km)</label><input name="km" type="number" inputmode="numeric" min="0" placeholder="optional" value="${b?.km ?? ""}"></div>
      </div>
      <label>Notiz</label><input name="notes" placeholder="z. B. Reifengröße 28 × 1,6" value="${esc(b?.notes)}">
      ${tpl}
      <button class="btn block" type="submit">Speichern</button>
      ${b ? `<button class="btn danger block" type="button" id="del-bike">Rad löschen</button>` : ""}
    </form>`);
  const f = document.getElementById("f-bike");
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(f);
    const kmVal = fd.get("km") === "" ? null : Math.max(0, Number(fd.get("km")));
    if (b) {
      Object.assign(b, { name: fd.get("name").trim(), type: fd.get("type"), km: kmVal, notes: fd.get("notes").trim() });
      save(); bikeDetail(b.id); render(); toast("Gespeichert");
    } else {
      const nb = { id: uid(), name: fd.get("name").trim(), type: fd.get("type"), km: kmVal, notes: fd.get("notes").trim(), tasks: [] };
      fd.getAll("tpl").forEach((i) => { const t = TEMPLATES[i]; nb.tasks.push({ id: uid(), name: t.name, days: t.days, km: t.km, lastDate: null, lastKm: null }); });
      state.bikes.push(nb); save(); closeSheet(); render(); toast("Rad angelegt");
    }
  });
  if (b) document.getElementById("del-bike").addEventListener("click", () => {
    if (!confirm(`„${b.name}" mit allen Einträgen löschen?`)) return;
    state.bikes = state.bikes.filter((x) => x.id !== b.id);
    state.log = state.log.filter((l) => l.bikeId !== b.id);
    save(); closeSheet(); render(); toast("Rad gelöscht");
  });
}

function taskForm(bikeId, taskId) {
  const b = bikeById(bikeId); const t = taskId ? b.tasks.find((x) => x.id === taskId) : null;
  const months = t && t.days && t.days % 30 === 0 ? t.days / 30 : null;
  openSheet(sheetHead(t ? "Wartungsarbeit" : "Neue Wartungsarbeit") + `
    <form id="f-task">
      <label>Was?</label><input name="name" required placeholder="z. B. Federgabel-Service" value="${esc(t?.name)}" list="tpl-names">
      <datalist id="tpl-names">${TEMPLATES.map((x) => `<option value="${esc(x.name)}">`).join("")}</datalist>
      <div class="two">
        <div><label>Alle … Tage</label><input name="days" type="number" inputmode="numeric" min="0" placeholder="z. B. 90" value="${t?.days || ""}"></div>
        <div><label>und/oder alle … km</label><input name="km" type="number" inputmode="numeric" min="0" placeholder="z. B. 1000" value="${t?.km || ""}"></div>
      </div>
      <p class="hint">Fällig ist, was zuerst erreicht wird. Tipp: 30 = monatlich, 365 = jährlich.${months ? " Aktuell: " + intervalText(t) + "." : ""}</p>
      ${t ? `<label>Zuletzt gemacht</label><input name="lastDate" type="date" value="${t.lastDate || ""}">` : ""}
      <button class="btn block" type="submit">Speichern</button>
      ${t ? `<button class="btn danger block" type="button" id="del-task">Wartungsarbeit entfernen</button>` : ""}
    </form>`);
  const f = document.getElementById("f-task");
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(f);
    const data = { name: fd.get("name").trim(), days: Number(fd.get("days")) || 0, km: Number(fd.get("km")) || 0 };
    if (t) { Object.assign(t, data); if (fd.has("lastDate")) t.lastDate = fd.get("lastDate") || null; }
    else b.tasks.push({ id: uid(), ...data, lastDate: null, lastKm: null });
    save(); bikeDetail(b.id); render(); toast("Gespeichert");
  });
  if (t) document.getElementById("del-task").addEventListener("click", () => {
    if (!confirm(`„${t.name}" aus dem Wartungsplan entfernen? Der Verlauf bleibt erhalten.`)) return;
    b.tasks = b.tasks.filter((x) => x.id !== t.id); save(); bikeDetail(b.id); render();
  });
}

function doneForm(bikeId, taskId) {
  const b = bikeById(bikeId); const t = taskId ? b.tasks.find((x) => x.id === taskId) : null;
  openSheet(sheetHead(t ? t.name : "Reparatur eintragen") + `
    <div class="sub">${esc(b.name)}</div>
    <form id="f-done">
      ${t ? "" : `<label>Was wurde gemacht?</label><input name="what" required placeholder="z. B. Schlauch hinten geflickt" list="tpl-names2"><datalist id="tpl-names2">${b.tasks.map((x) => `<option value="${esc(x.name)}">`).join("")}</datalist>`}
      <div class="two">
        <div><label>Datum</label><input name="date" type="date" required value="${todayISO()}" max="${todayISO()}"></div>
        <div><label>Tachostand (km)</label><input name="km" type="number" inputmode="numeric" min="0" placeholder="optional" value="${b.km ?? ""}"></div>
      </div>
      <div class="two">
        <div><label>Kosten (€)</label><input name="cost" type="number" inputmode="decimal" step="0.01" min="0" placeholder="optional"></div>
        <div></div>
      </div>
      <label>Notiz</label><textarea name="note" placeholder="z. B. Bremsbeläge vorne getauscht, Shimano B01S"></textarea>
      <button class="btn block" type="submit">✓ Eintragen</button>
    </form>`);
  const f = document.getElementById("f-done");
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(f);
    const date = fd.get("date");
    const kmVal = fd.get("km") === "" ? null : Math.max(0, Number(fd.get("km")));
    const name = t ? t.name : fd.get("what").trim();
    // Freie Reparatur mit gleichem Namen wie eine Wartungsarbeit zählt auch als erledigt
    const task = t || b.tasks.find((x) => x.name.toLowerCase() === name.toLowerCase());
    state.log.push({ id: uid(), bikeId: b.id, taskId: task ? task.id : null, taskName: name, date, km: kmVal, cost: fd.get("cost") ? Number(fd.get("cost")) : null, note: fd.get("note").trim(), created: new Date().toISOString() });
    if (task && (!task.lastDate || date >= task.lastDate)) { task.lastDate = date; task.lastKm = kmVal; }
    if (kmVal != null && (b.km == null || kmVal > b.km)) b.km = kmVal;
    save(); closeSheet(); render(); toast("Eingetragen ✓");
  });
}

function kmForm(bikeId) {
  const b = bikeById(bikeId);
  openSheet(sheetHead("Tachostand") + `<div class="sub">${esc(b.name)}</div>
    <form id="f-km"><label>Aktueller Kilometerstand</label>
      <input name="km" type="number" inputmode="numeric" min="0" required value="${b.km ?? ""}" autofocus>
      <p class="hint">Damit werden kilometerabhängige Wartungen (z. B. Kette) berechnet.</p>
      <button class="btn block" type="submit">Speichern</button></form>`);
  const f = document.getElementById("f-km");
  f.addEventListener("submit", (e) => {
    e.preventDefault(); b.km = Math.max(0, Number(new FormData(f).get("km"))); save(); bikeDetail(b.id); render(); toast("Tachostand gespeichert");
  });
}

function delLog(id) {
  const l = state.log.find((x) => x.id === id); if (!l) return;
  if (!confirm(`Eintrag „${l.taskName}" vom ${fmt(l.date)} löschen?`)) return;
  state.log = state.log.filter((x) => x.id !== id);
  // letztes Datum der Aufgabe neu bestimmen
  const b = bikeById(l.bikeId);
  const t = b && b.tasks.find((x) => x.id === l.taskId);
  if (t) {
    const prev = state.log.filter((x) => x.taskId === t.id).sort((a, c) => c.date.localeCompare(a.date))[0];
    t.lastDate = prev ? prev.date : null; t.lastKm = prev ? prev.km : null;
  }
  save(); if (b) bikeDetail(b.id); render();
}

/* ---------- Ansicht: Sicherung (iCloud Drive) ---------- */
function renderMore() {
  const m = state.meta;
  const standalone = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  setHeader("Sicherung", "Daten über iCloud Drive auf alle Geräte bringen");
  view.innerHTML = `
    <div class="card">
      <div class="title">In iCloud Drive sichern</div>
      <p class="sub">Erstellt eine Sicherungsdatei. Im folgenden Fenster <strong>„In Dateien sichern"</strong> wählen, dann <strong>iCloud Drive</strong> und am besten immer denselben Ordner, z. B. „Rad-Wartung". Vorhandene Datei ersetzen.</p>
      <button class="btn block" data-act="export">☁️ Jetzt sichern</button>
      <p class="hint">Letzte Sicherung: ${m.lastBackup ? new Date(m.lastBackup).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" }) : "noch nie"}${m.lastChange && (!m.lastBackup || m.lastBackup < m.lastChange) ? " · <span style='color:var(--amber)'>seitdem geändert</span>" : ""}</p>
    </div>
    <div class="card">
      <div class="title">Aus iCloud Drive laden</div>
      <p class="sub">Auf einem anderen Gerät (iPad, Mac) die Sicherungsdatei aus iCloud Drive auswählen. Die Daten auf diesem Gerät werden dabei ersetzt.</p>
      <button class="btn ghost block" data-act="import">Sicherung laden…</button>
    </div>
    <div class="card">
      <div class="title">So geht der Wechsel zwischen Geräten</div>
      <ol class="steps"><li>Auf dem Gerät, auf dem du eingetragen hast: <strong>Jetzt sichern</strong>.</li><li>Auf dem anderen Gerät: <strong>Sicherung laden</strong>.</li></ol>
      <p class="hint">Am einfachsten: hauptsächlich auf einem Gerät eintragen und gelegentlich sichern.</p>
    </div>
    ${standalone ? "" : `<div class="card"><div class="title">Als App auf den Home-Bildschirm</div>
      <ol class="steps"><li>Diese Seite in <strong>Safari</strong> öffnen.</li><li>Unten auf <strong>Teilen</strong> (Quadrat mit Pfeil) tippen.</li><li><strong>„Zum Home-Bildschirm"</strong> wählen.</li></ol>
      <p class="hint">Wichtig: Die App auf dem Home-Bildschirm hat einen eigenen Speicher. Wenn du vorher hier in Safari etwas eingetragen hast, erst sichern und in der App wieder laden.</p></div>`}
    <h2>Sonstiges</h2>
    <div class="card">
      <button class="btn ghost block" data-act="ics" style="margin-top:0">📅 Termine in den iPhone-Kalender</button>
      <button class="btn danger block" data-act="wipe">Alle Daten auf diesem Gerät löschen</button>
    </div>
    <p class="hint" style="text-align:center">${state.bikes.length} Räder · ${state.log.length} Einträge · gespeichert auf diesem Gerät</p>`;
}

async function shareOrDownload(blob, filename, title) {
  const file = new File([blob], filename, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title }); return true; }
    catch (e) { if (e.name === "AbortError") return false; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}
async function exportData() {
  const prev = state.meta.lastBackup;
  state.meta.lastBackup = new Date().toISOString();
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const ok = await shareOrDownload(blob, "Rad-Wartung-Sicherung.json", "Rad-Wartung Sicherung");
  if (ok) { save(false); toast("Sicherung erstellt"); } else state.meta.lastBackup = prev;
  render();
}
document.getElementById("file-in").addEventListener("change", (e) => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!valid(d)) throw new Error();
      const info = `${d.bikes.length} Räder und ${d.log.length} Einträge` + (d.meta?.lastBackup ? `, gesichert am ${new Date(d.meta.lastBackup).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" })}` : "");
      if (state.bikes.length && !confirm(`Sicherung mit ${info} laden?\n\nDie aktuellen Daten auf diesem Gerät werden ersetzt.`)) return;
      d.meta = d.meta || {};
      d.meta.lastChange = d.meta.lastBackup || new Date().toISOString();
      state = d; save(false); tab = "due"; render(); toast("Sicherung geladen");
    } catch (err) { alert("Diese Datei ist keine gültige Rad-Wartung-Sicherung."); }
  };
  r.readAsText(file);
});
function wipe() {
  if (!confirm("Wirklich alle Räder und Einträge auf diesem Gerät löschen? Eine Sicherung in iCloud bleibt erhalten.")) return;
  state = blank(); save(false); tab = "due"; render(); toast("Gelöscht");
}

/* Kalenderdatei (.ics) für den iPhone-Kalender */
async function exportICS() {
  const items = allTasks().filter((x) => x.st.nextDate);
  if (!items.length) { toast("Noch keine Termine mit Datum"); return; }
  const icsEsc = (s) => String(s).replace(/[\\;,]/g, (c) => "\\" + c).replace(/\n/g, "\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const today = todayISO();
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Rad-Wartung//DE", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Rad-Wartung"];
  items.forEach(({ bike, task, st }) => {
    const d = st.nextDate < today ? today : st.nextDate;
    const end = addDays(d, 1);
    lines.push("BEGIN:VEVENT", `UID:${task.id}-${st.nextDate}@rad-wartung`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${d.replace(/-/g, "")}`, `DTEND;VALUE=DATE:${end.replace(/-/g, "")}`,
      `SUMMARY:${icsEsc("🔧 " + task.name + " – " + bike.name)}`,
      `DESCRIPTION:${icsEsc("Wartung " + intervalText(task) + ". Zuletzt: " + fmt(task.lastDate))}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc(task.name)}`, "TRIGGER:PT9H", "END:VALARM", "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
  await shareOrDownload(blob, "Rad-Wartung-Termine.ics", "Rad-Wartung Termine");
}

/* ---------- Start ---------- */
render();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
